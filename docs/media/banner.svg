<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0D12"/>
      <stop offset="55%" stop-color="#11151D"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amberLine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="220" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="220" rx="18" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="219" rx="17.5" stroke="rgba(255,255,255,0.1)"/>

  <!-- Left Geometric Icon -->
  <g transform="translate(64, 54)">
    <rect width="112" height="112" rx="26" fill="#131720" stroke="rgba(245,158,11,0.42)" stroke-width="2"/>
    <rect x="20" y="28" width="72" height="56" rx="10" stroke="#F59E0B" stroke-width="5"/>
    <rect x="31" y="47" width="20" height="6" rx="3" fill="#F1F4F9"/>
    <rect x="56" y="47" width="25" height="6" rx="3" fill="#98A2B3"/>
    <rect x="31" y="61" width="32" height="6" rx="3" fill="#F59E0B"/>
    <rect x="68" y="61" width="13" height="6" rx="3" fill="#F1F4F9"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="204" y="102" fill="#F1F4F9" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.02em">SRT Embedder</text>
  <text x="206" y="136" fill="#98A2B3" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">Lossless Subtitle Muxing · GPU Hardsub Studio · Watch Daemon · Instant Atomic Undo</text>

  <!-- Feature Chips -->
  <g transform="translate(204, 152)">
    <rect width="136" height="26" rx="13" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.35)"/>
    <text x="68" y="17" text-anchor="middle" fill="#FCD34D" font-family="Cascadia Code, monospace" font-size="11.5" font-weight="600">mkvmerge + ffmpeg</text>

    <g transform="translate(148, 0)">
      <rect width="128" height="26" rx="13" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.32)"/>
      <text x="64" y="17" text-anchor="middle" fill="#86EFAC" font-family="Cascadia Code, monospace" font-size="11.5" font-weight="600">UTF-8 / CJK / RTL</text>
    </g>

    <g transform="translate(288, 0)">
      <rect width="166" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="83" y="17" text-anchor="middle" fill="#CBD5E1" font-family="Cascadia Code, monospace" font-size="11.5" font-weight="600">SRT · VTT · ASS · TTML</text>
    </g>

    <g transform="translate(466, 0)">
      <rect width="114" height="26" rx="13" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.14)"/>
      <text x="57" y="17" text-anchor="middle" fill="#CBD5E1" font-family="Cascadia Code, monospace" font-size="11.5" font-weight="600">NVENC / x264</text>
    </g>
  </g>

  <rect x="80" y="218" width="1040" height="2" fill="url(#amberLine)"/>
</svg>

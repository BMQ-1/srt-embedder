<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" fill="none">
  <defs>
    <linearGradient id="waveRail" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0"/>
      <stop offset="22%" stop-color="#64748B" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="78%" stop-color="#64748B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Outer wings -->
  <line x1="40" y1="18" x2="534" y2="18" stroke="url(#waveRail)" stroke-width="1.2"/>
  <line x1="666" y1="18" x2="1160" y2="18" stroke="url(#waveRail)" stroke-width="1.2"/>

  <!-- Outbound speech-pulse photons -->
  <circle cy="18" r="2" fill="#22C55E">
    <animate attributeName="cx" values="534;90" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.75;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cy="18" r="2" fill="#22C55E">
    <animate attributeName="cx" values="666;1110" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.9;0.9;0" keyTimes="0;0.75;1" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Symmetrical VAD equalizer bars -->
  <g stroke-linecap="round">
    <rect x="548" y="14" width="3" height="8" rx="1.5" fill="#38BDF8" fill-opacity="0.75">
      <animate attributeName="height" values="6;16;6" dur="1.5s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;10;15" dur="1.5s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="557" y="12" width="3" height="12" rx="1.5" fill="#22C55E" fill-opacity="0.82">
      <animate attributeName="height" values="8;22;8" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="14;7;14" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="566" y="9" width="3" height="18" rx="1.5" fill="#F59E0B" fill-opacity="0.88">
      <animate attributeName="height" values="10;26;10" dur="1.15s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="13;5;13" dur="1.15s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="575" y="11" width="3" height="14" rx="1.5" fill="#FBBF24">
      <animate attributeName="height" values="8;22;8" dur="1.4s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="14;7;14" dur="1.4s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="584" y="13" width="3" height="10" rx="1.5" fill="#F59E0B">
      <animate attributeName="height" values="6;18;6" dur="1.25s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;9;15" dur="1.25s" begin="0.45s" repeatCount="indefinite"/>
    </rect>

    <!-- Center core -->
    <rect x="598" y="6" width="4" height="24" rx="2" fill="#FBBF24">
      <animate attributeName="height" values="14;28;14" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="11;4;11" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Mirror right -->
    <rect x="613" y="13" width="3" height="10" rx="1.5" fill="#F59E0B">
      <animate attributeName="height" values="6;18;6" dur="1.25s" begin="0.45s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;9;15" dur="1.25s" begin="0.45s" repeatCount="indefinite"/>
    </rect>
    <rect x="622" y="11" width="3" height="14" rx="1.5" fill="#FBBF24">
      <animate attributeName="height" values="8;22;8" dur="1.4s" begin="0.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="14;7;14" dur="1.4s" begin="0.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="631" y="9" width="3" height="18" rx="1.5" fill="#F59E0B" fill-opacity="0.88">
      <animate attributeName="height" values="10;26;10" dur="1.15s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="y" values="13;5;13" dur="1.15s" begin="0.35s" repeatCount="indefinite"/>
    </rect>
    <rect x="640" y="12" width="3" height="12" rx="1.5" fill="#22C55E" fill-opacity="0.82">
      <animate attributeName="height" values="8;22;8" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="14;7;14" dur="1.3s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="649" y="14" width="3" height="8" rx="1.5" fill="#38BDF8" fill-opacity="0.75">
      <animate attributeName="height" values="6;16;6" dur="1.5s" begin="0.0s" repeatCount="indefinite"/>
      <animate attributeName="y" values="15;10;15" dur="1.5s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

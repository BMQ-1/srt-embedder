<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 36" width="1200" height="36" fill="none">
  <defs>
    <linearGradient id="railGrad" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0"/>
      <stop offset="18%" stop-color="#64748B" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="82%" stop-color="#64748B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#64748B" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweepL" x1="-300" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
      <animate attributeName="x1" values="-260;600;-260" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;860;0" dur="5.2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweepR" x1="1200" y1="0" x2="1500" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FBBF24" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
      <animate attributeName="x1" values="1200;340;1200" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1460;600;1460" dur="5.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Base subtle track -->
  <line x1="40" y1="18" x2="574" y2="18" stroke="url(#railGrad)" stroke-width="1.3"/>
  <line x1="626" y1="18" x2="1160" y2="18" stroke="url(#railGrad)" stroke-width="1.3"/>

  <!-- Kinetic dual energy sweep -->
  <line x1="40" y1="18" x2="574" y2="18" stroke="url(#sweepL)" stroke-width="2" stroke-linecap="round"/>
  <line x1="626" y1="18" x2="1160" y2="18" stroke="url(#sweepR)" stroke-width="2" stroke-linecap="round"/>

  <!-- Traveling tracer sparks -->
  <circle cy="18" r="2.2" fill="#FCD34D">
    <animate attributeName="cx" values="572;120" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.15;0.8;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="18" r="2.2" fill="#FCD34D">
    <animate attributeName="cx" values="628;1080" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.95;0.95;0" keyTimes="0;0.15;0.8;1" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Breathing sonar pulse rings -->
  <circle cx="600" cy="18" r="7" stroke="#F59E0B" stroke-width="1.2">
    <animate attributeName="r" values="7;16" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.75;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="18" r="7" stroke="#38BDF8" stroke-width="1">
    <animate attributeName="r" values="7;15" begin="1.3s" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.65;0" begin="1.3s" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Slowly orbiting core diamond -->
  <g>
    <rect x="594" y="12" width="12" height="12" rx="3" fill="#F59E0B" stroke="#FDE68A" stroke-width="1">
      <animateTransform attributeName="transform" type="rotate" from="45 600 18" to="405 600 18" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="0.78;1;0.78" dur="2.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

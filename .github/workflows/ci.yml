name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg & MKVToolNix (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix

      - name: Install FFmpeg & MKVToolNix (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full mkvtoolnix
          echo "/opt/homebrew/opt/ffmpeg-full/bin" >> $GITHUB_PATH
          echo "/usr/local/opt/ffmpeg-full/bin" >> $GITHUB_PATH

      - name: Install FFmpeg & MKVToolNix (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg mkvtoolnix -y --no-progress
          refreshenv

      - name: Verify lean CLI-only install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          srt-embedder --version
          srt-embedder doctor --json

      - name: Install full GUI + dev + trash extras
        run: python -m pip install -e ".[gui,dev,trash]"

      - name: Verify installed CLI entrypoints
        run: |
          srt-embedder --help
          srt-embedder doctor --json
          srt-embedder profile list --json

      - name: Check JS syntax
        run: node --check srt_embedder/ui/app.js

      - name: Run pytest
        run: python -m pytest -v

      - name: Run headless UI smoke check (Linux)
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright
          python -m playwright install chromium --with-deps
          python scripts/ui_smoke_test.py

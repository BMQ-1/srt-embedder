name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package & build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,dev,trash]"

      - name: Install FFmpeg, MKVToolNix & Inno Setup
        shell: pwsh
        run: |
          choco install ffmpeg mkvtoolnix innosetup -y --no-progress
          refreshenv

      - name: Verify installed CLI
        run: |
          srt-embedder --help
          srt-embedder doctor --json

      - name: Verify PyPI wheel/sdist build & assets
        run: |
          python -m pip install build twine
          python -I -m build --outdir dist/pypi
          python -m twine check dist/pypi/*

      - name: Build Windows bundle, installer & SHA256SUMS
        shell: pwsh
        run: .\scripts\build_release.ps1 -RequireInstaller

      - name: Upload GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SRT-Embedder-win64-portable.zip
            dist/SHA256SUMS.txt
            dist/pypi/*
            installer/Output/*.exe
